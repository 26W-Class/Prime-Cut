<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="flexbox.css">
  </head>
  <body>
    <header class="container">
      <h1>Great <span>Cut</span></h1>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Contact</a></li>
          <li><a href="#">About</a></li>
        </ul>
      </nav>
    </header>

    <main>
        <section class="hero">
            <img src="assets/logo.jpg" alt="logo">
        </section>
        <section class="wrapper">
            <div class="wrap-sect"></div>
            <div class="wrap-sect"></div>
            <div class="wrap-sect"></div>
            <div class="wrap-sect"></div>
            <div class="wrap-sect"></div>
        </section>
        <!-- Grid Section -->
        <section>
            <h2>Grid Example</h2>
            <div class="inline">
                <div class="grd">Item 1</div>
                <div class="grd">Item 2</div>
                <div class="grd">Item 3</div>
                <div class="grd">Item 4</div>
            </div>
        </section>
        <section>
            <h2>Grid Layout</h2>
            <div class="conta row">
                <div class="grid-item">Item One</div>
                <div class="grid-item">Item Two</div>
                <div class="grid-item">Item Three</div>
                <div class="grid-item">Item Four</div>
            </div>
        </section>
        <section>
            <h2>Grid Layout</h2>
            <div class="conta column">
                <div class="grid-item">Item One</div>
                <div class="grid-item">Item Two</div>
                <div class="grid-item">Item Three</div>
                <div class="grid-item">Item Four</div>
            </div>
        </section>
    </main>
  </body>
</html>
